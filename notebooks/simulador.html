<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Contaminação Temporal - NEU</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; background: #ecf0f1; padding: 20px; border-radius: 8px; }
        .control-group { display: flex; justify-content: space-between; align-items: center; }
        input[type=range] { width: 55%; cursor: pointer; }
        .valor-display { font-weight: bold; width: 60px; text-align: right; color: #2980b9; }

        .toggle-switch { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: bold; padding: 15px; background: #fff; border: 2px solid #bdc3c7; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .toggle-switch.active { border-color: #27ae60; color: #27ae60; background: #eafaf1; }
        .toggle-switch input { transform: scale(1.5); cursor: pointer; }

        .timeline-container { position: relative; height: 100px; background: #ecf0f1; border-radius: 5px; overflow: hidden; margin-top: 30px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Blocos Físicos Exibidos pelo Monitor */
        .block { position: absolute; height: 100%; top: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); transition: left 0.1s, width 0.1s; }
        .face-block { background-color: #3498db; }
        .isi-block { background-color: #e74c3c; }

        /* A nossa Janela de Coleta de Dados (O Código Python) */
        .recording-window { position: absolute; height: 100%; top: 0; border: 4px solid #2ecc71; background: repeating-linear-gradient(45deg, rgba(46, 204, 113, 0.15), rgba(46, 204, 113, 0.15) 10px, rgba(46, 204, 113, 0.3) 10px, rgba(46, 204, 113, 0.3) 20px); transition: left 0.3s, width 0.3s; z-index: 10; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; font-size: 14px; font-weight: bold; color: #27ae60; text-shadow: 1px 1px 0px #fff; }
        
        .axis { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #7f8c8d; font-weight: bold; }
        
        .status-panel { margin-top: 30px; padding: 20px; border-radius: 5px; text-align: center; font-size: 20px; font-weight: bold; transition: 0.3s; }
        .status-safe { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .status-danger { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análise de Latência (Display Jitter)</h1>
    <p class="subtitle">Efeito da Janela de Segurança na Coleta de Áreas de Interesse (AOIs)</p>

    <div class="controls">
        <div class="control-group">
            <label>Atraso/Adiantamento do Monitor (Jitter):</label>
            <input type="range" id="jitter" min="-300" max="300" value="0" step="10">
            <span class="valor-display" id="jitter-val">0 ms</span>
        </div>
        <div class="control-group">
            <label>Duração do Ponto Vermelho (ISI):</label>
            <input type="range" id="isi" min="500" max="1500" value="1000" step="50">
            <span class="valor-display" id="isi-val">1000 ms</span>
        </div>
    </div>

    <label class="toggle-switch" id="toggle-label">
        <input type="checkbox" id="safety-window">
        Ativar Janela de Segurança (Corte de 100ms Início / 200ms Fim)
    </label>

    <div class="timeline-container">
        <div class="block face-block" id="face-block">FACE (Estímulo)</div>
        <div class="block isi-block" id="isi-block">PONTO VERMELHO</div>
        <div class="recording-window" id="recording-window">Janela de Coleta Ativa</div>
    </div>
    
    <div class="axis">
        <span>0 ms</span>
        <span>1000 ms</span>
        <span>2000 ms</span>
        <span>3000 ms</span>
        <span>4000 ms</span>
    </div>

    <div id="status-panel" class="status-panel status-safe">
        ✅ Seguro: Apenas a Face está sendo registrada.
    </div>
</div>

<script>
    // Referências do DOM
    const jitterSlider = document.getElementById('jitter');
    const isiSlider = document.getElementById('isi');
    const jitterVal = document.getElementById('jitter-val');
    const isiVal = document.getElementById('isi-val');
    const safetyToggle = document.getElementById('safety-window');
    const toggleLabel = document.getElementById('toggle-label');
    
    const faceBlock = document.getElementById('face-block');
    const isiBlock = document.getElementById('isi-block');
    const recordingWindow = document.getElementById('recording-window');
    const statusPanel = document.getElementById('status-panel');

    const TOTAL_TIME = 4000; // Milissegundos do ciclo
    
    function atualizarSimulador() {
        const jitter = parseInt(jitterSlider.value);
        const isi = parseInt(isiSlider.value);
        const isSafe = safetyToggle.checked;

        // Atualizar textos dos controles
        jitterVal.textContent = (jitter > 0 ? "+" : "") + jitter + " ms";
        isiVal.textContent = isi + " ms";

        // Mudar estilo do botão de segurança
        if (isSafe) {
            toggleLabel.classList.add('active');
        } else {
            toggleLabel.classList.remove('active');
        }

        // 1. Calcular a Realidade Física (O que a tela mostra)
        // A face deveria ir de 0 a 3000. Com jitter, ela desloca.
        const physicalFaceStart = 0 + jitter;
        const physicalFaceEnd = 3000 + jitter;
        
        // O Ponto Vermelho entra logo após a face e dura o tempo de ISI
        const physicalIsiStart = physicalFaceEnd;
        const physicalIsiEnd = physicalIsiStart + isi;

        // Converter ms para porcentagem de largura (Width) na interface (baseado em 4000ms totais)
        const msToPct = (ms) => (ms / TOTAL_TIME) * 100;

        faceBlock.style.left = msToPct(physicalFaceStart) + "%";
        faceBlock.style.width = msToPct(3000) + "%";

        isiBlock.style.left = msToPct(physicalIsiStart) + "%";
        isiBlock.style.width = msToPct(isi) + "%";

        // 2. Calcular a Realidade de Coleta (O que o Python salva)
        let recStart = 0;
        let recEnd = 3000;

        if (isSafe) {
            recStart = 100; // Corta os primeiros 100ms
            recEnd = 2800;  // Corta os últimos 200ms
        }

        recordingWindow.style.left = msToPct(recStart) + "%";
        recordingWindow.style.width = msToPct(recEnd - recStart) + "%";

        // 3. Checar Contaminação Cruzada
        // Contamina se o tempo de coleta (Python) cruzar com o tempo do Ponto Vermelho (Monitor)
        let isContaminated = false;

        // Se o Ponto Vermelho começar ANTES de o Python parar de gravar...
        if (physicalIsiStart < recEnd) {
            isContaminated = true;
        }

        // Se o Ponto Vermelho anterior (do ciclo passado) invadir o início deste ciclo...
        // Um jitter positivo alto empurraria o final do ponto vermelho para dentro do próximo ciclo
        if (physicalFaceStart > recStart) {
            isContaminated = true;
        }

        // Atualizar Painel de Status
        if (isContaminated) {
            statusPanel.className = "status-panel status-danger";
            statusPanel.innerHTML = "⚠️ ALERTA DE CONTAMINAÇÃO!<br><span style='font-size: 14px; font-weight: normal;'>O Ponto Vermelho (ou tela cinza) está vazando para dentro das suas AOIs.</span>";
        } else {
            statusPanel.className = "status-panel status-safe";
            statusPanel.innerHTML = "✅ DADOS SEGUROS<br><span style='font-size: 14px; font-weight: normal;'>A janela de gravação está capturando exclusivamente o rosto.</span>";
        }
    }

    // Event Listeners
    jitterSlider.addEventListener('input', atualizarSimulador);
    isiSlider.addEventListener('input', atualizarSimulador);
    safetyToggle.addEventListener('change', atualizarSimulador);

    // Inicialização
    atualizarSimulador();
</script>

</body>
</html>
